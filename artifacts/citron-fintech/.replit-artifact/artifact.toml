kind = "mobile"
previewPath = "/"
title = "Citron Fintech"
description = "An iOS-first fintech trading and product marketplace prototype for client demos, with simulated authentication, market data, orders, portfolio, listings, and an accessible Citron Light theme."
version = "1.0.0"
id = "artifacts/citron-fintech"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20512

[services.development]
run = "pnpm --filter @workspace/citron-fintech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/citron-fintech", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/citron-fintech", "run", "serve" ]

[services.env]
PORT = "20512"
BASE_PATH = "/"
